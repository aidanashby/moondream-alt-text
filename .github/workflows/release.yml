# Builds the installable plugin zip for a version tag and attaches it to the GitHub release.
# Plugin Update Checker (enableReleaseAssets) installs updates from this zip.
#
# To release: bump the version in the plugin header (and version constant, if the plugin has one),
# add a "## [x.y.z] - date" section to CHANGELOG.md if the repo has one, commit, then push a tag such as v1.2.0.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
      SLUG: ${{ github.event.repository.name }}
      PLUGIN_DIR: .   # folder holding <slug>.php, relative to the repo root
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Check plugin version matches tag
        run: |
          want="${TAG#v}"
          main="$PLUGIN_DIR/$SLUG.php"
          header=$(sed -n 's/^[ *]*Version: *//p' "$main" | head -1 | tr -d '\r')
          echo "tag=$want header=$header"
          [ "$header" = "$want" ]
          if grep -qE "define\( *'[A-Z_]+_VERSION'|const VERSION" "$main"; then
            grep -q "'$want'" "$main" || { echo "Version constant not bumped to $want"; exit 1; }
          fi

      - name: Build plugin zip
        run: |
          tree=HEAD
          [ "$PLUGIN_DIR" = "." ] || tree="HEAD:$PLUGIN_DIR"
          git archive --format=zip --prefix="$SLUG/" -o "$SLUG.zip" "$tree"

      - name: Publish release with zip
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$SLUG.zip" --clobber
          else
            : > notes.md
            if [ -f CHANGELOG.md ]; then
              awk -v v="${TAG#v}" '/^## /{h = $0; gsub(/[][]/, "", h); split(h, w, " "); p = (w[2] == v); next} p' CHANGELOG.md > notes.md
            fi
            gh release create "$TAG" "$SLUG.zip" --title "$TAG" --notes-file notes.md --generate-notes
          fi
